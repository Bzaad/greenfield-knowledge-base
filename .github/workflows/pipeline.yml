# GitHub Actions Pipeline — KnowledgeBase API
# Jobs: build → test → publish → deploy-staging → deploy-production
#
# Required secrets (Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS          - az ad sp create-for-rbac output (JSON)
#   STAGING_CONNECTION_STRING  - SQL Server connection string for staging
#   PROD_CONNECTION_STRING     - SQL Server connection string for production
#
# Required GitHub Environments (Settings → Environments):
#   staging    - no approval gate required
#   production - add required reviewers for the manual approval gate

on:
  push:
    branches: [main, "release/**"]
    paths: ["src/KnowledgeBase/**"]
  pull_request:
    branches: [main]
    paths: ["src/KnowledgeBase/**"]

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release
  REGISTRY: greenfieldkbacr.azurecr.io
  IMAGE_NAME: greenfield-kb-api
  APP_SERVICE_NAME: greenfield-kb-api
  RESOURCE_GROUP: greenfield-kb-rg

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/KnowledgeBase/KnowledgeBase.slnx

      - name: Build
        run: |
          dotnet build src/KnowledgeBase/KnowledgeBase.slnx \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore

      - name: Build (warnings as errors)
        run: |
          dotnet build src/KnowledgeBase/KnowledgeBase.slnx \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            -warnaserror

  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests with coverage
        run: |
          dotnet test src/KnowledgeBase/KnowledgeBase.Tests/KnowledgeBase.Tests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage gate (≥80%)
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/**/coverage.cobertura.xml | head -1)
          echo "Line coverage: $COVERAGE"
          python3 -c "import sys; c=float('$COVERAGE'); sys.exit(0 if c >= 0.80 else 1)"

  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name greenfieldkbacr

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/KnowledgeBase
          file: src/KnowledgeBase/KnowledgeBase.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ───────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: publish
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run EF migrations (staging)
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project src/KnowledgeBase/KnowledgeBase.Api \
            --connection "${{ secrets.STAGING_CONNECTION_STRING }}"

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          slot-name: staging
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}

      - name: Smoke test (staging)
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ env.APP_SERVICE_NAME }}-staging.azurewebsites.net/health)
            [ "$STATUS" = "200" ] && exit 0
            sleep 5
          done
          echo "Health check failed"; exit 1

  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Manual approval gate: add required reviewers to the "production" environment
    # in Settings → Environments before enabling this job in a real deployment.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run EF migrations (production)
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project src/KnowledgeBase/KnowledgeBase.Api \
            --connection "${{ secrets.PROD_CONNECTION_STRING }}"

      - name: Swap slots (staging → production)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --name ${{ env.APP_SERVICE_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --slot staging \
              --target-slot production
